name: roota compatibility

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roota-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pin executable revision metadata
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          full = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          short = subprocess.check_output(['git', 'rev-parse', '--short=8', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'GIT_COMMIT_HASH={full}\nGIT_COMMIT_HASH_SHORT={short}\n')
          PY
      - name: Upgrade preservation checker regressions
        run: python3 -m unittest discover -s tests/upgrade_audit -p 'test_*.py'
      - name: Install native dependencies
        timeout-minutes: 10
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang libclang-dev cmake pkg-config libssl-dev liburing-dev libsystemd-dev
          rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: roota-${{ runner.os }}-rust-1.98.1-${{ hashFiles('Cargo.lock') }}
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Production executable strict Clippy
        run: cargo clippy -p conduwuit --locked -- -D warnings
      - name: Build protocol-test executable
        run: cargo build --bin conduwuit --locked
      - name: Verify executable source revision
        run: |
          python3 - <<'PY'
          import subprocess
          revision = subprocess.check_output(['git', 'rev-parse', '--short=8', 'HEAD'], text=True).strip()
          version = subprocess.check_output(['target/debug/conduwuit', '--version'], text=True).strip()
          assert revision in version, (revision, version)
          print(version)
          PY
      - name: Two-server protocol tests
        run: python3 tests/compat_smoke.py --binary target/debug/conduwuit --work-dir "$RUNNER_TEMP/compat-native"
      - name: Independent Synapse interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/synapse-venv"
          "$RUNNER_TEMP/synapse-venv/bin/pip" install 'matrix-synapse==1.164.2'
          python3 tests/compat_smoke.py --binary target/debug/conduwuit --synapse-python "$RUNNER_TEMP/synapse-venv/bin/python" --work-dir "$RUNNER_TEMP/compat-synapse"
